<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotjozef | Officiell Hemsida</title>
    <style>
        /* Grundinställningar */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Ljus bakgrund */
        body {
            background-color: #f8fafc;
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Ny container för det utskjutande utseendet */
        .page-wrap {
            max-width: 480px;
            width: 100%;
            position: relative; /* För att bilden ska kunna positioneras relativt till denna */
            margin-top: 100px; /* Ger plats för den utstickande bilden */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Vit containerbox med mörk kant */
        .container {
            width: 100%;
            text-align: center;
            background: #ffffff;
            padding: 130px 24px 50px 24px; /* Justerar padding upptill för att ge plats för bilden */
            border-radius: 24px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
            border: 2px solid #0f172a; /* Svart/mörk ring */
            z-index: 1; /* Flyttar containern bakom bilden */
        }

        /* STÖRRE CIRKEL SOM STICKER UT */
        .profile-wrap {
            position: absolute;
            top: -100px; /* Positionerar den 100px *utanför* containern */
            z-index: 2; /* Ser till att den hamnar framför containern */
            width: 200px; /* Rejält mycket större cirkel */
            height: 200px;
            border-radius: 50%;
            padding: 10px; /* Ger mellanrum mellan bild och kant */
            background-color: #f8fafc; /* Matchar sidans bakgrundsfärg */
            border: 6px solid #0f172a; /* Svart/mörk ring runt bilden */
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover; /* Ser till att bilden fyller cirkeln snyggt */
        }

        /* Mörk textinställningar */
        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 12px;
            color: #0f172a;
        }

        .bio {
            color: #475569;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 35px;
            font-weight: 500;
        }

        /* Länkknappar */
        .links {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            display: block;
            padding: 16px 20px;
            background-color: #ffffff;
            color: #0f172a;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.05rem;
            transition: all 0.2s ease-in-out;
            border: 2px solid #0f172a; /* Svart kant på knappar */
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.05);
        }

        /* Knappar blir svarta/mörka vid hover */
        .btn:hover {
            background-color: #0f172a;
            color: #ffffff;
            border-color: #0f172a;
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
        }

        footer {
            margin-top: 40px;
            font-size: 0.85rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="page-wrap">
        <!-- STÖRRE UTSTICKANDE CIRKEL -->
        <div class="profile-wrap">
            <!-- Jag förutsätter att du laddade upp 'profile.jpg' enligt tidigare. Om inte, se mina tidigare instruktioner! -->
            <img class="profile-img" src="profile.jpg" alt="Fotjozef Profilbild">
        </div>

        <div class="container">
            <h1>Fotjozef</h1>
            <p class="bio">Välkommen! Här hittar du alla mina kanaler, projekt och annat skoj.</p>

            <div class="links">
                <a href="https://www.tiktok.com/@dintiktok" target="_blank" class="btn">TikTok</a>
                <a href="https://www.instagram.com/dittinsta" target="_blank" class="btn">Instagram</a>
                <a href="https://www.youtube.com/dinkanal" target="_blank" class="btn">YouTube</a>
                <a href="mailto:kontakt@fotjozef.se" class="btn">Kontakta Mig</a>
            </div>

            <footer>
                © 2026 Fotjozef. Alla rättigheter förbehållna.
            </footer>
        </div>
    </div>

</body>
</html>
