<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotjozef | Officiell Hemsida</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 480px;
            width: 100%;
            text-align: center;
            background: #1e293b;
            padding: 40px 24px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 3px solid #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .bio {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: block;
            padding: 14px 20px;
            background-color: #334155;
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease-in-out;
            border: 1px solid #475569;
        }

        .btn:hover {
            background-color: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 32px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Profilbild (ändra länken nedan till din bild när du vill) -->
        <img class="profile-img" src="profile.jpg" alt="Fotjozef">

        <h1>Fotjozef</h1>
        <p class="bio">Välkommen! Här hittar du alla mina kanaler, projekt och annat skoj.</p>

        <div class="links">
            <a href="https://www.tiktok.com" target="_blank" class="btn">TikTok</a>
            <a href="https://www.instagram.com" target="_blank" class="btn">Instagram</a>
            <a href="https://www.youtube.com" target="_blank" class="btn">YouTube</a>
            <a href="mailto:kontakt@fotjozef.se" class="btn">Kontakta Mig</a>
        </div>

        <footer>
            © 2026 Fotjozef. Alla rättigheter förbehållna.
        </footer>
    </div>

</body>
</html>
