<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotjozef</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="page-wrap">
        <div class="container">
            <h1>Fotjozef <span class="verified-badge">✓</span></h1>
            <p class="tagline">Officiell samlingssida</p>
            <p class="sub-tagline">Välkommen hit! Utforska mina senaste videor och projekt.</p>
        </div>
    </div>

    <!-- HJUL-FLIK PÅ HÖGER KANT (LIGGER KVAR PERMANENT) -->
    <div class="wheel-tab" id="wheelTab">
        SPELA & VINN!
    </div>

    <!-- MODAL FÖR LYCKOHJUL -->
    <div class="wheel-modal-overlay" id="wheelModal">
        <div class="wheel-modal-content">
            <button class="wheel-close-btn" id="wheelCloseBtn">&times;</button>
            <h2 class="wheel-modal-title">Lyckohjulet</h2>
            <p class="wheel-modal-sub">Snurra för att se vad du vinner!</p>
            
            <div class="wheel-container">
                <div class="wheel-pointer">▼</div>
                <div class="wheel" id="wheel">
                    <div class="wheel-slice"><span>Vinst 1</span></div>
                    <div class="wheel-slice"><span>Vinst 2</span></div>
                    <div class="wheel-slice"><span>Vinst 3</span></div>
                    <div class="wheel-slice"><span>Vinst 4</span></div>
                    <div class="wheel-slice"><span>Vinst 5</span></div>
                    <div class="wheel-slice"><span>Vinst 6</span></div>
                    <div class="wheel-slice"><span>Vinst 7</span></div>
                    <div class="wheel-slice"><span>Vinst 8</span></div>
                </div>
            </div>

            <button class="wheel-spin-action-btn" id="spinBtn">SNURRA HJULET</button>
            <div class="wheel-result-box" id="wheelResult"></div>
        </div>
    </div>

    <!-- JAVASCRIPT FÖR ATT ÖPPNA/SNURRA HJULET -->
    <script>
        const wheelTab = document.getElementById('wheelTab');
        const wheelModal = document.getElementById('wheelModal');
        const wheelCloseBtn = document.getElementById('wheelCloseBtn');
        const spinBtn = document.getElementById('spinBtn');
        const wheel = document.getElementById('wheel');
        const wheelResult = document.getElementById('wheelResult');

        // Öppna modalen när man klickar på fliken
        wheelTab.addEventListener('click', () => {
            wheelModal.style.display = 'flex';
        });

        // Stäng modalen
        wheelCloseBtn.addEventListener('click', () => {
            wheelModal.style.display = 'none';
        });

        // Stäng om man klickar utanför rutan
        window.addEventListener('click', (e) => {
            if (e.target === wheelModal) {
                wheelModal.style.display = 'none';
            }
        });

        // Snurra-funktion (utan tidsspärr eller borttagning av flik)
        spinBtn.addEventListener('click', () => {
            spinBtn.disabled = true;
            wheelResult.textContent = "Hjulet snurrar...";
            
            const randomDegree = Math.floor(Math.random() * 3600) + 720;
            wheel.style.transition = 'transform 4s cubic-bezier(0.15, 0.30, 0.15, 1)';
            wheel.style.transform = `rotate(${randomDegree}deg)`;

            setTimeout(() => {
                wheelResult.innerHTML = "Grattis! Du vann ett hemligt pris! <br><a href='#' class='wheel-link-btn'>Hämta vinst</a>";
                spinBtn.disabled = false;
            }, 4000);
        });
    </script>
</body>
</html>
